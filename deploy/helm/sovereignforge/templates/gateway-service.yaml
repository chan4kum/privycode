apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereignforge.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-gateway
