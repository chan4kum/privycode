apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereignforge.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "sovereignforge.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
