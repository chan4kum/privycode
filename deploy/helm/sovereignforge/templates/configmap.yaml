apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sovereignforge.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "sovereignforge.name" . }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  GATEWAY_PORT: {{ .Values.gateway.service.port | quote }}
  WORKER_PORT: {{ .Values.worker.service.port | quote }}
  INFERENCE_RUNTIME: {{ .Values.worker.runtime | quote }}
  DEFAULT_MODEL: {{ .Values.worker.model | quote }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.database.user }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
