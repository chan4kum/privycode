apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereignforge.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sovereignforge.name" . }}-worker
    spec:
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.worker.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "sovereignforge.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
