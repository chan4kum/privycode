name: SovereignForge & PrivyCode CD Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  deploy-gcp:
    name: Build & Deploy to Google Cloud Platform
    runs-on: ubuntu-latest
    if: github.repository_owner == 'chan4kum'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP Artifact Registry
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Push Gateway Container
        if: env.GCP_SA_KEY != ''
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'sovereignforge-prod' }}/prod-sovereignforge/gateway"
          docker build -f deploy/docker/Dockerfile.gateway -t $IMAGE_URI:${{ github.sha }} -t $IMAGE_URI:latest .
          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Push Inference Worker Container
        if: env.GCP_SA_KEY != ''
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'sovereignforge-prod' }}/prod-sovereignforge/worker"
          docker build -f deploy/docker/Dockerfile.worker -t $IMAGE_URI:${{ github.sha }} -t $IMAGE_URI:latest .
          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Gateway to Google Cloud Run
        if: env.GCP_SA_KEY != ''
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'sovereignforge-prod' }}/prod-sovereignforge/gateway:${{ github.sha }}"
          gcloud run deploy sovereignforge-gateway \
            --image=$IMAGE_URI \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --vpc-connector=prod-cr-conn \
            --vpc-egress=private-ranges-only
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  publish-release:
    name: Publish GitHub Release & VSIX Asset
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Package Extension VSIX
        working-directory: apps/vscode-extension
        run: |
          npm install
          npm run compile
          ./node_modules/.bin/vsce package --no-dependencies

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/vscode-extension/privycode-*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
