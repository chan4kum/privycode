name: SovereignForge & PrivyCode CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pytest & E2E Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovereignforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/db/requirements.txt
          pip install -r apps/api/requirements.txt
          pip install -r services/inference_worker/requirements.txt
          pip install pytest pytest-asyncio tabulate

      - name: Seed Database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sovereignforge
        run: |
          python packages/db/seed.py

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sovereignforge
          REDIS_URL: redis://localhost:6379/0
        run: |
          PYTHONPATH=. pytest tests/

  extension-build:
    name: VS Code Extension Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Extension Dependencies
        working-directory: apps/vscode-extension
        run: |
          npm install

      - name: Compile TypeScript
        working-directory: apps/vscode-extension
        run: |
          npm run compile

      - name: Run Extension SymbolGraph Tests
        working-directory: apps/vscode-extension
        run: |
          node out/test/symbolGraph.test.js

      - name: Package .vsix Release Bundle
        working-directory: apps/vscode-extension
        run: |
          ./node_modules/.bin/vsce package --no-dependencies

      - name: Upload .vsix Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privycode-extension-vsix
          path: apps/vscode-extension/privycode-*.vsix
          if-no-files-found: error

  docker-build-verification:
    name: Production Docker Images Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.gateway
          push: false
          tags: sovereignforge/gateway:test

      - name: Build Inference Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.worker
          push: false
          tags: sovereignforge/worker:test
